services:
  postgres:
    image: postgres:16-alpine
    container_name: adapteval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-adapteval_agent}
    ports:
      # Host-side port is decoupled from the container's internal 5432
      # (which DB_PORT below/inside the app always uses) so this doesn't
      # collide with a PostgreSQL already running on your machine.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-adapteval_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: adapteval-agent
    # src/main.py runs a single demo evaluation and exits; it's not a
    # long-running server, so it shouldn't be restarted in a loop.
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-adapteval_agent}
      USE_POSTGRES_MEMORY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  pgdata:
